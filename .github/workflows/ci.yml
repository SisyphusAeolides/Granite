name: Granite validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-fortran:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: x86_64-unknown-uefi
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --features fortran-policy
      - run: cargo check --locked --target x86_64-unknown-uefi --features uefi-bin
      - run: scripts/check-reproducible-uefi.sh
      - run: git diff --check && git diff --exit-code

  idris-agda:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential chezscheme libgmp-dev xz-utils curl
      - uses: actions/cache@v4
        with:
          path: target/formal/toolchains
          key: granite-formal-idris2-0.8.0-agda-2.8.0-v1
      - run: scripts/bootstrap-formal-toolchains.sh
